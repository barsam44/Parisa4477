name: Download OpSuS GNOME ISO and split

on:
  workflow_dispatch:

jobs:
  split-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl

      - name: Download GNOME ISO
        run: |
          set -e
          mkdir -p downloads
          # Try primary URL first, then fallback, then another mirror
          curl -L --retry 3 -o downloads/opsus-gnome.iso \
            "https://sourceforge.net/projects/opsus/files/latest/download/opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso" \
          || curl -L -o downloads/opsus-gnome.iso \
            "http://ftp.svenskalinuxforeningen.se/distributions/exton/exton-opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso" \
          || curl -L -o downloads/opsus-gnome.iso \
            "https://downloads.sourceforge.net/project/opsus/opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso"

          # Check if the file is at least 100 MB
          size=$(stat -c%s downloads/opsus-gnome.iso)
          if [ "$size" -lt 100000000 ]; then
            echo "Downloaded file is too small (${size} bytes). Likely download failed."
            exit 1
          fi
          echo "Downloaded ISO: $((size / 1024 / 1024)) MB"

      - name: Split into 50 MB archives
        run: |
          set -e
          mkdir -p archives
          7z a -v50m archives/opsus-gnome.7z downloads/opsus-gnome.iso
          echo "Split files:"
          ls -lh archives/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opsus-gnome-50mb-parts
          path: archives/
