name: Download OpSuS GNOME ISO and split into 50MB

on:
  workflow_dispatch:   # run manually from Actions tab

jobs:
  split-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl

      - name: Download GNOME ISO
        run: |
          mkdir -p downloads
          SF_URL="https://sourceforge.net/projects/opsus/files/latest/download/opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso"
          ALT_URL="http://ftp.svenskalinuxforeningen.se/distributions/exton/exton-opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso"
          echo "Downloading GNOME ISO (2640 MB) …"
          curl -L -o downloads/opsus-gnome.iso "$SF_URL" || curl -L -o downloads/opsus-gnome.iso "$ALT_URL"

      - name: Create 50 MB split archives
        run: |
          mkdir -p archives
          # -v50m = split into volumes of 50 MB
          7z a -v50m archives/opsus-gnome.7z downloads/opsus-gnome.iso

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: opsus-gnome-50mb-parts
          path: archives/
