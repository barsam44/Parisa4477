name: OpSuS GNOME → 50 MB max‑compressed split archives

on:
  workflow_dispatch:

jobs:
  compress-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl

      - name: Download GNOME ISO
        run: |
          set -e
          mkdir -p split-archives
          # Browser‑mimic user agent to avoid SourceForge blocks
          curl -L --retry 5 --retry-delay 10 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:102.0) Gecko/20100101 Firefox/102.0" \
            -o opsus-gnome.iso \
            "https://sourceforge.net/projects/opsus/files/latest/download" \
          || curl -L --retry 5 \
            -H "User-Agent: Mozilla/5.0" \
            -o opsus-gnome.iso \
            "http://ftp.svenskalinuxforeningen.se/distributions/exton/exton-opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso"

          size=$(stat -c%s opsus-gnome.iso)
          if [ "$size" -lt 100000000 ]; then
            echo "Download failed or ISO too small (${size} bytes). Aborting."
            exit 1
          fi
          echo "Downloaded ${size} bytes ($((size / 1024 / 1024)) MB)"

      - name: Ultra‑compress and split into 50 MB volumes
        run: |
          set -e
          7z a -v50m -mx=9 -m0=lzma2 -md=256m -ms=on -mmt=on \
            split-archives/opsus-gnome.7z opsus-gnome.iso
          rm opsus-gnome.iso   # save disk space
          echo "Created compressed split files:"
          ls -lh split-archives/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add split-archives/
          git commit -m "Add OpSuS GNOME ISO (max-compressed 50 MB parts)" || echo "Nothing to commit"
          git push
