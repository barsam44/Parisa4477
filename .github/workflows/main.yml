name: NomadBSD ISO → 50 MB compressed parts

on:
  workflow_dispatch:

jobs:
  compress-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl jq

      - name: Download NomadBSD ISO (mirror method)
        run: |
          set -e
          mkdir -p split-archives

          # 1. Get the filename from SourceForge API
          API_URL="https://sourceforge.net/projects/nomadbsd/best_release.json"
          FILENAME=$(curl -s -H "Accept: application/json" "$API_URL" | jq -r '.release.filename')

          if [ -z "$FILENAME" ] || [ "$FILENAME" = "null" ]; then
            echo "Could not get filename from API"
            exit 1
          fi
          echo "Latest release filename: $FILENAME"

          # 2. Build a direct mirror URL (skips the redirect page)
          # We use a reliable mirror that accepts curl.
          MIRROR_BASE="https://netcologne.dl.sourceforge.net/project/nomadbsd"
          DOWNLOAD_URL="${MIRROR_BASE}/${FILENAME}"

          # Fallback to another mirror if the first one fails
          FALLBACK_MIRROR="https://gigenet.dl.sourceforge.net/project/nomadbsd"
          FALLBACK_URL="${FALLBACK_MIRROR}/${FILENAME}"

          echo "Trying primary URL: $DOWNLOAD_URL"
          curl -L --retry 5 --retry-delay 15 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:102.0) Gecko/20100101 Firefox/102.0" \
            -o nomadbsd.iso "$DOWNLOAD_URL" \
          || {
            echo "Primary mirror failed, trying fallback URL: $FALLBACK_URL"
            curl -L --retry 5 --retry-delay 15 \
              -H "User-Agent: Mozilla/5.0" \
              -o nomadbsd.iso "$FALLBACK_URL" || {
                echo "All mirrors failed. Trying the generic SourceForge link as last resort."
                curl -L --retry 5 -H "User-Agent: Mozilla/5.0" \
                  -o nomadbsd.iso "https://sourceforge.net/projects/nomadbsd/files/latest/download"
              }
          }

          # 3. Verify size (NomadBSD iso is > 2 GB)
          size=$(stat -c%s nomadbsd.iso)
          if [ "$size" -lt 2000000000 ]; then
            echo "Downloaded file too small (${size} bytes). Aborting."
            exit 1
          fi
          echo "Downloaded ${size} bytes ($((size / 1024 / 1024)) MB)"

      - name: Ultra‑compress and split
        run: |
          set -e
          7z a -v50m -mx=9 -m0=lzma2 -md=256m -ms=on -mmt=on \
            split-archives/nomadbsd.7z nomadbsd.iso
          rm nomadbsd.iso
          ls -lh split-archives/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add split-archives/
          git commit -m "Add NomadBSD ISO (max-compressed 50 MB parts)" || echo "Nothing to commit"
          git push
