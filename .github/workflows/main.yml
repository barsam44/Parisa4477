name: Download NomadBSD ISO and commit 50 MB compressed parts

on:
  workflow_dispatch:   # manual trigger only

jobs:
  compress-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push commits to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl

      - name: Download NomadBSD ISO
        run: |
          set -e
          mkdir -p split-archives
          # Browser‑mimic user agent to avoid SourceForge blocks
          curl -L --retry 5 --retry-delay 10 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:102.0) Gecko/20100101 Firefox/102.0" \
            -o nomadbsd.iso \
            "https://sourceforge.net/projects/nomadbsd/files/latest/download" \
          || curl -L --retry 5 \
            -H "User-Agent: Mozilla/5.0" \
            -o nomadbsd.iso \
            "https://sourceforge.net/projects/nomadbsd/files/latest/download"

          # Verify the file is large enough (min 100 MB)
          size=$(stat -c%s nomadbsd.iso)
          if [ "$size" -lt 100000000 ]; then
            echo "Download failed or ISO too small (${size} bytes). Aborting."
            exit 1
          fi
          echo "Downloaded ${size} bytes ($((size / 1024 / 1024)) MB)"

      - name: Ultra‑compress and split into 50 MB volumes
        run: |
          set -e
          7z a -v50m -mx=9 -m0=lzma2 -md=256m -ms=on -mmt=on \
            split-archives/nomadbsd.7z nomadbsd.iso
          rm nomadbsd.iso   # free disk space before git
          echo "Created compressed split files:"
          ls -lh split-archives/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add split-archives/
          git commit -m "Add NomadBSD ISO (max-compressed 50 MB parts)" || echo "Nothing to commit"
          git push
