name: NomadBSD ISO → 50 MB compressed parts

on:
  workflow_dispatch:

jobs:
  compress-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl jq

      - name: Download NomadBSD ISO via SourceForge API
        run: |
          set -e
          mkdir -p split-archives

          API_URL="https://sourceforge.net/projects/nomadbsd/best_release.json"
          DOWNLOAD_URL=$(curl -s -H "Accept: application/json" "$API_URL" | \
            jq -r '.release.url + "/" + .release.filename')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Could not retrieve download URL from API"
            exit 1
          fi

          echo "Resolved URL: $DOWNLOAD_URL"

          curl -L --retry 5 --retry-delay 15 \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:102.0) Gecko/20100101 Firefox/102.0" \
            -o nomadbsd.iso \
            "$DOWNLOAD_URL"

          size=$(stat -c%s nomadbsd.iso)
          if [ "$size" -lt 2000000000 ]; then
            echo "Downloaded file too small (${size} bytes). Aborting."
            exit 1
          fi
          echo "Downloaded ${size} bytes ($((size / 1024 / 1024)) MB)"

      - name: Ultra‑compress and split into 50 MB volumes
        run: |
          set -e
          7z a -v50m -mx=9 -m0=lzma2 -md=256m -ms=on -mmt=on \
            split-archives/nomadbsd.7z nomadbsd.iso
          rm nomadbsd.iso
          ls -lh split-archives/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add split-archives/
          git commit -m "Add NomadBSD ISO (max-compressed 50 MB parts)" || echo "Nothing to commit"
          git push
