name: Download OpSuS and split into 50 MB archives

on:
  workflow_dispatch:                     # manual trigger only

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl wget

      - name: Download ISO files
        run: |
          mkdir -p downloads
          cd downloads

          # Primary URL (SourceForge)
          SF_BASE="https://sourceforge.net/projects/opsus/files/latest/download"
          # Fallback URL (Swedish Linux Society)
          SE_BASE="http://ftp.svenskalinuxforeningen.se/distributions/exton"

          # KDE ISO (3030 MB)
          echo "Downloading KDE ISO …"
          curl -L -o exton-kde.iso \
            "$SF_BASE/opsus-64bit-tumbleweed-kde-refractasnapshot-3030mb-251122.iso" \
            || curl -L -o exton-kde.iso \
            "$SE_BASE/exton-opsus-64bit-tumbleweed-kde-refractasnapshot-3030mb-251122.iso"

          # GNOME ISO (2640 MB)
          echo "Downloading GNOME ISO …"
          curl -L -o exton-gnome.iso \
            "$SF_BASE/opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso" \
            || curl -L -o exton-gnome.iso \
            "$SE_BASE/exton-opsus-64bit-tumbleweed-gnome-refractasnapshot-2640mb-251115.iso"

      - name: Create 50 MB split archives
        run: |
          mkdir -p archives
          for iso in downloads/*.iso; do
              name="$(basename "$iso" .iso)"
              # Create a 7‑Zip multi‑volume archive (50 MB per part)
              7z a -v50m "archives/${name}.7z" "$iso"
          done

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: opsus-50mb-archives
          path: archives/
